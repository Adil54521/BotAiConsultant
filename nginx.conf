events { worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types; # Важно для корректных стилей CSS
    default_type  application/octet-stream;
    client_max_body_size 100m;

    server {
        listen 80 default_server;
        server_name mobility.kuam.kz 193.193.226.136;

        # Статика (HTML, CSS, JS)
        location / {
            root /usr/share/nginx/html;
            index aithorization_form.html;
            try_files $uri $uri/ $uri.html =404;
        }

        # API запросы для Node.js
        location /api/ {
            proxy_pass http://api:8000/; # Косая черта в конце важна
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /ws {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
