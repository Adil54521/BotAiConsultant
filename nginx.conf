events { worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types; # Важно для корректных стилей CSS
    default_type  application/octet-stream;
    client_max_body_size 100m;

    server {
        listen 80 default_server;
        server_name mobility.kuam.kz 193.193.226.136;

        # Only the explicit web UI assets are public. The project root also contains
        # secrets, backups and logs and must never be used as a generic file server.
        location = / {
            root /usr/share/nginx/html;
            try_files /aithorization_form.html =404;
        }

        location ~ ^/(aithorization_form\.html|account\.html|styles\.css|profile\.css|scripts\.js|account\.js)$ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # API запросы для Node.js
        location /api/ {
            proxy_pass http://api:8004/; # Косая черта в конце важна
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /ws {
            proxy_pass http://api:8004;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            return 404;
        }
    }
}
