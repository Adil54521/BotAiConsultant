version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro 
      - ./migrations/001_bot_registration_analytics.sql:/docker-entrypoint-initdb.d/002_bot_registration_analytics.sql:ro

  api:
    build: .
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=postgres
      - DB_PORT=5432
      - PORT=8004
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - AI_DAILY_COST_LIMIT_USD=${AI_DAILY_COST_LIMIT_USD:-5}
      - AI_DAILY_REQUEST_LIMIT=${AI_DAILY_REQUEST_LIMIT:-100}
      - AI_PER_USER_REQUESTS_PER_MINUTE=${AI_PER_USER_REQUESTS_PER_MINUTE:-4}
      - AI_GLOBAL_REQUESTS_PER_MINUTE=${AI_GLOBAL_REQUESTS_PER_MINUTE:-20}
      - AI_MAX_CONCURRENT_REQUESTS=${AI_MAX_CONCURRENT_REQUESTS:-3}
      - AI_PENDING_RESERVE_USD=${AI_PENDING_RESERVE_USD:-0.02}
      - AI_PENDING_TIMEOUT_SECONDS=${AI_PENDING_TIMEOUT_SECONDS:-180}
      - BOT_INSTANCE_LEASE_TTL_SECONDS=${BOT_INSTANCE_LEASE_TTL_SECONDS:-90}
      - GEMINI_INPUT_USD_PER_MILLION=${GEMINI_INPUT_USD_PER_MILLION:-0.30}
      - GEMINI_CACHED_INPUT_USD_PER_MILLION=${GEMINI_CACHED_INPUT_USD_PER_MILLION:-0.03}
      - GEMINI_OUTPUT_USD_PER_MILLION=${GEMINI_OUTPUT_USD_PER_MILLION:-2.50}
      - GEMINI_SEARCH_USD_PER_QUERY=${GEMINI_SEARCH_USD_PER_QUERY:-0.014}
      - GEMINI_EMBEDDING_DAILY_LIMIT=${GEMINI_EMBEDDING_DAILY_LIMIT:-1000}
      - GEMINI_EMBEDDING_MAX_RPM=${GEMINI_EMBEDDING_MAX_RPM:-30}
      - GEMINI_EMBEDDING_MAX_CONCURRENCY=${GEMINI_EMBEDDING_MAX_CONCURRENCY:-3}
      - GEMINI_EMBEDDING_MAX_CHARS=${GEMINI_EMBEDDING_MAX_CHARS:-12000}
      - GEMINI_EMBEDDING_INPUT_USD_PER_MILLION=${GEMINI_EMBEDDING_INPUT_USD_PER_MILLION:-0.15}
      - AI_EMBEDDING_DAILY_COST_LIMIT_USD=${AI_EMBEDDING_DAILY_COST_LIMIT_USD:-1}
      - AI_DOCUMENT_MAX_BYTES=${AI_DOCUMENT_MAX_BYTES:-20971520}
      - AI_DOCUMENT_MAX_CHUNKS=${AI_DOCUMENT_MAX_CHUNKS:-500}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Qyzylorda}
    ports:
      - "8004:8004"
    volumes:
      - ./storage:/usr/src/app/storage
    depends_on:
      - db

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=postgres
      - DB_PORT=5432
      - BACKEND_URL=http://api:8004
      - BACKEND_WS_URL=ws://api:8004
      - BOT_TOKEN=${BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      - GEMINI_MODEL=${GEMINI_MODEL:-models/gemini-3.5-flash-lite}
      - GEMINI_MAX_ATTEMPTS=${GEMINI_MAX_ATTEMPTS:-1}
      - GEMINI_MAX_INPUT_TOKENS=${GEMINI_MAX_INPUT_TOKENS:-6000}
      - GEMINI_CHAT_MAX_OUTPUT_TOKENS=${GEMINI_CHAT_MAX_OUTPUT_TOKENS:-384}
      - GEMINI_HISTORY_MAX_OUTPUT_TOKENS=${GEMINI_HISTORY_MAX_OUTPUT_TOKENS:-512}
      - GEMINI_COMPLEX_MAX_OUTPUT_TOKENS=${GEMINI_COMPLEX_MAX_OUTPUT_TOKENS:-768}
      - GEMINI_INPUT_USD_PER_MILLION=${GEMINI_INPUT_USD_PER_MILLION:-0.30}
      - GEMINI_CACHED_INPUT_USD_PER_MILLION=${GEMINI_CACHED_INPUT_USD_PER_MILLION:-0.03}
      - GEMINI_OUTPUT_USD_PER_MILLION=${GEMINI_OUTPUT_USD_PER_MILLION:-2.50}
      - GEMINI_SEARCH_USD_PER_QUERY=${GEMINI_SEARCH_USD_PER_QUERY:-0.014}
      - GEMINI_PRICING_EFFECTIVE_DATE=${GEMINI_PRICING_EFFECTIVE_DATE:-2026-11-05}
      - AI_MAX_CONCURRENT_REQUESTS=${AI_MAX_CONCURRENT_REQUESTS:-3}
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Qyzylorda}
    depends_on:
      - db
      - api

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./aithorization_form.html:/usr/share/nginx/html/aithorization_form.html:ro
      - ./account.html:/usr/share/nginx/html/account.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./scripts.js:/usr/share/nginx/html/scripts.js:ro
      - ./account.js:/usr/share/nginx/html/account.js:ro
    depends_on:
      - api

  pgadminer-web:
    image: adminer:latest
    container_name: adminer_container
    restart: always
    ports:
      - "2552:8080"
    environment:
      - PHP_CLI_SERVER_PORT=9000
    depends_on:
      - db

volumes:
  pgdata:
#  pgadmin_data:
