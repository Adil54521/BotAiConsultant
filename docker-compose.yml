version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql:ro 

  api:
    build: .
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=postgres
      - DB_PORT=5432
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    volumes:
      - ./storage:/usr/src/app/storage
    depends_on:
      - db

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=postgres
      - DB_PORT=5432
      - API_URL=http://api:3000
      - BOT_TOKEN=8682510689:AAERp2ap0MX8c6hDwgIEAbT7fZhUJih22hA
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db
      - api

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - .:/usr/share/nginx/html:ro # Монтируем весь корень проекта как папку со статикой
    depends_on:
      - api

  pgadminer-web:
    image: adminer:latest
    container_name: adminer_container
    restart: always
    ports:
      - "2552:8080"
    environment:
      - PHP_CLI_SERVER_PORT=9000
    depends_on:
      - db

volumes:
  pgdata:
#  pgadmin_data:
